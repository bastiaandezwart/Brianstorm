<title>Brainstorm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: werkbord — vaste balk boven, brede kolommen met ideeën, lade rechts voor detail. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #eef0ec;
  --border: #dde1da;
  --text: #1b211d;
  --muted: #5f6b63;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ee;
  --danger: #c2410c;
  --warn: #b45309;
  --warn-ink: #92400e;
  --kans: #dcf3e3;
  --kans-text: #166534;
  --zorg: #fde7dc;
  --zorg-text: #9a3412;
  --neutraal: #edf0ec;
  --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 1px 3px rgba(20, 30, 25, 0.08);
  --shadow-lg: 0 12px 32px rgba(20, 30, 25, 0.18);
  --scrim: rgba(15, 20, 18, 0.35);
  --radius: 10px;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  /* Perspectieven: vulling (witte tekst erop ≥ 5:1) en tekstkleur op het oppervlak (≥ 4.5:1) */
  --r-ea: #1d4ed8; --r-pm: #15803d; --r-hr: #b45309; --r-sa: #7e22ce; --r-klant: #0e7490; --r-gtm: #be123c; --r-risico: #475569;
  --r-ea-ink: #1d4ed8; --r-pm-ink: #15803d; --r-hr-ink: #b45309; --r-sa-ink: #7e22ce; --r-klant-ink: #0e7490; --r-gtm-ink: #be123c; --r-risico-ink: #475569;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #171c19; --surface-2: #1f2521; --border: #2c3430; --text: #e5ebe7; --muted: #9aa8a0;
    --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #143430; --danger: #fb923c; --warn: #fbbf24; --warn-ink: #fbbf24;
    --kans: #133222; --kans-text: #86efac; --zorg: #3a1d12; --zorg-text: #fdba74; --neutraal: #222924;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55); --scrim: rgba(0, 0, 0, 0.5);
    --r-ea-ink: #93c5fd; --r-pm-ink: #86efac; --r-hr-ink: #fcd34d; --r-sa-ink: #d8b4fe; --r-klant-ink: #67e8f9; --r-gtm-ink: #fda4af; --r-risico-ink: #cbd5e1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171c19; --surface-2: #1f2521; --border: #2c3430; --text: #e5ebe7; --muted: #9aa8a0;
  --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #143430; --danger: #fb923c; --warn: #fbbf24; --warn-ink: #fbbf24;
  --kans: #133222; --kans-text: #86efac; --zorg: #3a1d12; --zorg-text: #fdba74; --neutraal: #222924;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55); --scrim: rgba(0, 0, 0, 0.5);
  --r-ea-ink: #93c5fd; --r-pm-ink: #86efac; --r-hr-ink: #fcd34d; --r-sa-ink: #d8b4fe; --r-klant-ink: #67e8f9; --r-gtm-ink: #fda4af; --r-risico-ink: #cbd5e1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { font: 15px/1.5 var(--font-body); background: var(--bg); color: var(--text); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0 0 0.4em; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 0.6em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.loading { padding: 4rem 1rem; text-align: center; color: var(--muted); }
code { font-size: 0.9em; background: var(--surface-2); padding: 0.05em 0.3em; border-radius: 4px; }

button, .btn {
  font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 0.4rem 0.8rem; display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover:not(:disabled) { background: var(--surface-2); }
button.danger { color: var(--danger); }
button.icon { padding: 0.2rem 0.45rem; min-width: 28px; justify-content: center; }
button.sm { padding: 0.2rem 0.55rem; font-size: 0.85rem; min-height: 28px; }
button.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
button.danger-solid:hover:not(:disabled) { background: var(--danger); filter: brightness(1.08); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
input, textarea, select {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.45rem 0.6rem; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 2.6rem; }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }

.appbar {
  display: flex; align-items: center; gap: 0.75rem; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 0.6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--text); display: flex; gap: 0.45rem; align-items: center; }
.brand:hover { text-decoration: none; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 0.8rem; }
.spacer { flex: 1; }
.page { max-width: 1400px; margin: 0 auto; padding-block: 1.25rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 0.6rem; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.25rem; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; min-width: 0; }
.section { margin-bottom: 2rem; }
.section-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
.section-head h2 { margin: 0; }
.banner { padding: 0.6rem 0.9rem; border-radius: 8px; background: var(--accent-soft); color: var(--text); margin-bottom: 1rem; font-size: 0.9rem; }
.banner.warn { background: var(--zorg); color: var(--zorg-text); }

.avatar {
  --c: var(--accent); display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--c); color: #fff; font-size: 0.7rem; font-weight: 700; flex: none; position: relative;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--c); overflow: visible;
}
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.avatar.sm { width: 22px; height: 22px; font-size: 0.6rem; }
.avatar.lg { width: 44px; height: 44px; font-size: 0.95rem; }
.avatar.vacant { background: var(--surface); color: var(--ci, var(--muted)); border: 1.5px dashed var(--c); box-shadow: none; }
.drawer:focus, .modal:focus { outline: none; }
.avatar.online::after { content: ''; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface); }
.avatars { display: flex; gap: 0.45rem; align-items: center; }
.tag { --c: var(--muted); display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 999px; color: var(--ci, var(--c)); background: color-mix(in srgb, var(--c) 11%, transparent); }
.badge { font-size: 0.72rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* Onboarding */
.center { min-height: 70vh; display: grid; place-items: center; padding-block: 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.center .panel { max-width: 680px; width: 100%; }
.role-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-top: 1rem; }
@media (max-width: 560px) { .role-pick { grid-template-columns: minmax(0, 1fr); } }
.role-pick button { justify-content: flex-start; padding: 0.9rem; text-align: left; gap: 0.75rem; white-space: normal; border-left: 4px solid var(--c); }
.role-pick button strong { display: block; }

.counter { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.star { position: relative; z-index: 1; margin-left: auto; min-width: 28px; min-height: 28px; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--muted); font-size: 1rem; }
.star[aria-pressed="true"] { color: var(--warn-ink); }
.comment .del { margin-left: auto; }
.matrix-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.9rem; pointer-events: none; }
.matrix-empty span { background: var(--surface); padding: 0.6rem 0.9rem; border-radius: 8px; box-shadow: var(--shadow); max-width: 32ch; }
.notes-warning { background: var(--zorg); color: var(--zorg-text); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.6rem; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; }
.notes-warning .row button { color: var(--text); }
.typing { font-size: 0.85rem; color: var(--accent); margin-bottom: 0.4rem; }
.list select, .list input[type=date] { padding: 0.15rem 0.3rem; font-size: 0.85rem; width: auto; }

/* Home */
.hero { display: flex; align-items: flex-end; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.hero h1 { font-size: 1.7rem; margin: 0; }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 0.9rem; }
.board-card { display: flex; flex-direction: column; gap: 0.4rem; color: var(--text); text-align: left; white-space: normal; align-items: stretch; padding: 1rem; }
.board-card:hover { box-shadow: var(--shadow-lg); }
.board-card h3 { margin: 0; }
.board-card .q { color: var(--muted); font-size: 0.9rem; flex: 1; }
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap: 0.6rem; margin-bottom: 0.9rem; }
.template { display: block; text-align: left; white-space: normal; padding: 0.75rem; }
.template.selected { border-color: var(--accent); background: var(--accent-soft); }
.template strong { display: block; margin-bottom: 0.2rem; }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 0.9rem; }
.team-card { border-top: 4px solid var(--c); }
.team-card ul { margin: 0.4rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.85rem; }
.kanban-wrap { overflow-x: auto; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 0.9rem; min-width: 920px; }
.kanban-col { background: var(--surface-2); border-radius: var(--radius); padding: 0.75rem; min-height: 140px; }
.kanban-col h3 { display: flex; justify-content: space-between; font-size: 0.9rem; }
.opp { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem; margin-bottom: 0.5rem; }
.opp-title { font-weight: 600; margin-bottom: 0.25rem; }
.opp select { width: auto; padding: 0.15rem 0.3rem; font-size: 0.8rem; }

/* Board */
.board-head { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; margin-bottom: 1rem; }
.board-head h1 { font-size: 1.5rem; margin: 0; }
.board-head .question { font-size: 1.05rem; color: var(--muted); margin-top: 0.2rem; }
.head-side { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-end; }
@media (max-width: 700px) { .head-side { align-items: flex-start; } }
.phases { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.3rem; }
.phase { border-radius: 999px; font-size: 0.82rem; padding: 0.25rem 0.75rem; }
.phase.done { color: var(--muted); }
.phase.current { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.phase .n { font-weight: 700; opacity: 0.75; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 8px; background: var(--surface-2); }
.timer.ending { background: var(--zorg); color: var(--zorg-text); }
.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); margin: 1rem 0; overflow-x: auto; }
.tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 0.55rem 0.9rem; color: var(--muted); }
.tab:hover:not(:disabled) { background: none; color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem; border-radius: 50%; border: 1.5px solid currentColor; font-size: 0.72rem; font-weight: 700; }
.tab .team { font-size: 0.68rem; font-weight: 700; padding: 0.05rem 0.4rem; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.step-bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin: -0.4rem 0 1rem; }
.step-bar p { margin: 0; color: var(--muted); font-size: 0.9rem; flex: 1; min-width: min(260px, 100%); }
.save-state { font-size: 0.8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 0.35rem; }
.save-state.error { color: var(--danger); font-weight: 600; }
.save-state .dot-ok { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
.help-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.9rem; margin: 0.6rem 0 0; padding: 0; list-style: none; counter-reset: step; }
.help-steps li { counter-increment: step; font-size: 0.9rem; }
.help-steps li::before { content: counter(step); display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 0.8rem; margin-bottom: 0.3rem; }
.help-steps strong { display: block; }
@media (max-width: 800px) { .help-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .help-steps { grid-template-columns: minmax(0, 1fr); } }
.extra-note { font-size: 0.85rem; color: var(--muted); margin: -0.2rem 0 0.6rem; }
.persp .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }

.composer { display: grid; grid-template-columns: minmax(0, 1fr) 180px 190px auto; gap: 0.5rem; align-items: start; }
@media (max-width: 800px) { .composer { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .composer textarea { grid-column: 1 / -1; } }
.chip { border-radius: 999px; font-size: 0.82rem; padding: 0.2rem 0.7rem; white-space: normal; text-align: left; }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.columns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 0.9rem; overflow-x: auto; padding-bottom: 1rem; align-items: start; }
.column { background: var(--surface-2); border-radius: var(--radius); padding: 0.6rem; }
.column-head { display: flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.3rem 0.6rem; }
.column-head h2 { margin: 0; font-size: 0.92rem; flex: 1; }
.page .panel h2 { font-size: 1.02rem; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c, var(--border)); border-radius: 8px; padding: 0.6rem 0.7rem; margin-bottom: 0.55rem; box-shadow: var(--shadow); }
.card:hover, .card:focus-within { box-shadow: var(--shadow-lg); }
.card-open { all: unset; display: block; cursor: pointer; margin: 0.3rem 0 0.5rem; white-space: pre-wrap; word-break: break-word; }
.card-open::after { content: ''; position: absolute; inset: 0; border-radius: 8px; }
.card-open:focus-visible { outline: none; }
.card-open:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-foot .avatar, .card-foot .votes { position: relative; z-index: 1; }
.card.shortlist { outline: 2px solid color-mix(in srgb, var(--warn) 55%, transparent); }
.card.geparkeerd { opacity: 0.55; }
.card-text { margin: 0.3rem 0 0.5rem; white-space: pre-wrap; word-break: break-word; }
.card-foot { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
.pdots { display: inline-flex; gap: 3px; }
.pdot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--c); }
.pdot.on { background: var(--c); }
.votes { display: inline-flex; align-items: center; gap: 0.15rem; margin-left: auto; }
.votes button { padding: 0; min-width: 28px; min-height: 28px; justify-content: center; font-size: 0.8rem; position: relative; z-index: 1; }
.votes .count { min-width: 1.4rem; text-align: center; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.votes .mine { color: var(--accent); }
.ai-strip { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 0.75rem; margin: 0.9rem 0; }
.suggestions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 0.6rem; margin-top: 0.7rem; }
.suggestion { background: var(--surface); border-radius: 8px; padding: 0.6rem; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.35rem; }
.suggestion p { margin: 0; }
.ai-busy { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.8rem; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 600; margin-bottom: 0.75rem; }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.drawer-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--surface); z-index: 41; box-shadow: var(--shadow-lg);
  overflow-y: auto; display: flex; flex-direction: column; gap: 1.1rem;
  padding: calc(env(safe-area-inset-top, 0px) + 1.1rem) max(1.25rem, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 3rem) 1.25rem;
}
.drawer h4 { margin-bottom: 0.5rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-family: var(--font-body); }
.drawer textarea.title { font-size: 1.1rem; font-weight: 600; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.segmented button { border: none; border-radius: 0; padding: 0.25rem 0.7rem; font-size: 0.85rem; }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button.on { background: var(--accent); color: var(--accent-ink); }
.persp { border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 8px; padding: 0.6rem 0.75rem; }
.persp-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; font-weight: 600; font-size: 0.9rem; flex-wrap: wrap; }
.persp.kans { background: var(--kans); }
.persp.zorg { background: var(--zorg); }
.sentiment-kans { color: var(--kans-text); }
.sentiment-zorg { color: var(--zorg-text); }
.scale { display: inline-flex; gap: 0.2rem; }
.scale button { width: 2rem; justify-content: center; padding: 0.2rem 0; }
.scale button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.8/dist/morphdom-umd.min.js"></script>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Inhoud: rollen, fasen en werkvormen
// ---------------------------------------------------------------------------
const ROLES = {
  ea: { label: 'Enterprise Architect', short: 'EA', color: 'var(--r-ea)', ink: 'var(--r-ea-ink)', lens: 'Strategie & landschap', questions: [

  pm: { label: 'Product Manager', short: 'PM', color: 'var(--r-pm)', ink: 'var(--r-pm-ink)', lens: 'Klant & propositie', questions: [
    'Welk probleem lossen we op, en voor wie precies?',
    'Waarom zou een klant hier nú voor betalen?',
    'Wat is de kleinste versie waarmee we het kunnen valideren?',
    'Wat maakt ons anders dan de alternatieven?'] },
  hr: { label: 'HR / Business Lead', short: 'BL', color: 'var(--r-hr)', ink: 'var(--r-hr-ink)', lens: 'Business & mensen', questions: [
    'Wat is het verdienmodel, en klopt de business case?',
    'Welke mensen en competenties hebben we nodig, en hebben we die?',
    'Past dit bij onze cultuur en hoe we willen samenwerken?',
    "Welke commerciële en organisatorische risico's lopen we?"] },
  sa: { label: 'Solution Architect', short: 'SA', color: 'var(--r-sa)', ink: 'var(--r-sa-ink)', lens: 'Oplossing & realisatie', questions: [
    'Kunnen we dit bouwen, en met welke bouwstenen en platformen?',
    'Welke integraties, data en beveiliging zijn kritisch?',
    'Wat kunnen we hergebruiken uit onze ServiceNow-ervaring?',
    'Hoeveel werk is een eerste versie, en waar zit de grootste technische onzekerheid?'] },
};
const ROLE_KEYS = Object.keys(ROLES);
// Perspectieven die niemand in het team als rol heeft. Iedereen mag ze invullen, Claude kan een aanzet geven.
const EXTRA = {
  klant: { label: 'Stem van de klant', short: 'KL', color: 'var(--r-klant)', ink: 'var(--r-klant-ink)', lens: 'Stem van de klant', questions: [
    'Hoe zou een klant dit idee in eigen woorden beschrijven?',
    'Wat houdt een klant tegen om ja te zeggen?',
    'Wie beslist bij de klant, en wie betaalt?'] },
  gtm: { label: 'Commercie & go-to-market', short: 'GTM', color: 'var(--r-gtm)', ink: 'var(--r-gtm-ink)', lens: 'Commercie & go-to-market', questions: [
    'Hoe vinden en bereiken we de eerste tien klanten?',
    'Welke prijs en welk prijsmodel passen hierbij?',
    'Welke partners of vendorprogramma’s helpen ons verkopen?'] },
  risico: { label: 'Risico & compliance', short: 'RC', color: 'var(--r-risico)', ink: 'var(--r-risico-ink)', lens: 'Risico & compliance', questions: [
    'Welke wet- en regelgeving speelt mee (AVG, AI Act, NIS2)?',
    'Welke security- en aansprakelijkheidsrisico’s lopen wij en de klant?',
    'Wat gebeurt er als het misgaat, en hoe vangen we dat op?'] },
};
const EXTRA_KEYS = Object.keys(EXTRA);
const LENSES = { ...ROLES, ...EXTRA };
const LENS_KEYS = Object.keys(LENSES);
// De vier stappen van een sessie. Elke stap is ook een tabblad.
const STEPS = [
  { key: 'ideeen', label: 'Ideeën verzamelen', short: 'Ideeën', hint: 'Schrijf zoveel mogelijk ideeën op, nog zonder te oordelen. Zet gerust een timebox.' },
  { key: 'perspectieven', label: 'Perspectieven', short: 'Perspectieven', hint: 'Zet de beste ideeën op de shortlist. Iedereen bekijkt ze vanuit de eigen rol: kans, neutraal of zorg.' },
  { key: 'matrix', label: 'Prioriteren', short: 'Prioriteren', hint: 'Geef elk idee een score voor impact en inspanning. De matrix laat zien wat eerst moet.' },
  { key: 'acties', label: 'Besluiten & acties', short: 'Besluiten', hint: 'Leg vast wat jullie besluiten en wie wat oppakt, met een deadline.' },
];
const STEP_KEYS = STEPS.map((x) => x.key);
const LEGACY_PHASE = { verkennen: 'ideeen', ideeen: 'ideeen', perspectieven: 'perspectieven', prioriteren: 'matrix', besluiten: 'acties' };
const stepOf = (b) => (STEP_KEYS.includes(b?.phase) ? b.phase : LEGACY_PHASE[b?.phase] ?? 'ideeen');
const STAGES = [
  { key: 'verkennen', label: 'Verkennen' }, { key: 'valideren', label: 'Valideren' },
  { key: 'bouwen', label: 'Bouwen' }, { key: 'geparkeerd', label: 'Geparkeerd' },
];
const TEMPLATES = [
  { key: 'horizon', title: 'Horizon verbreden', question: 'Op welke gebieden naast ServiceNow kunnen wij als team waarde toevoegen?',
    description: 'Verken nieuwe platformen, markten en diensten die aansluiten op onze gezamenlijke kennis van architectuur, product, mensen en oplossingen.',
    clusters: ['Andere platformen', 'Nieuwe markten / sectoren', 'Nieuwe diensten', 'AI & data', 'Eigen producten'] },
  { key: 'propositie', title: 'Nieuwe propositie ontwerpen', question: 'Hoe ziet een aantrekkelijke propositie eruit voor [doelgroep]?',
    description: 'Werk één kans uit tot een propositie: probleem, oplossing, waarde, verdienmodel en eerste stap.',
    clusters: ['Klantprobleem', 'Oplossing', 'Waardepropositie', 'Verdienmodel', 'Eerste experiment'] },
  { key: 'samenwerking', title: 'Ons samenwerkingsmodel', question: 'Hoe willen wij als vier partners samenwerken en groeien?',
    description: 'Rollen, verantwoordelijkheden, besluitvorming, verdeling en ambities van het partnerschap.',
    clusters: ['Rollen & verantwoordelijkheden', 'Besluitvorming', 'Financieel model', 'Groei & mensen', 'Cultuur & waarden'] },
  { key: 'premortem', title: 'Pre-mortem', question: 'Stel: over een jaar is dit initiatief mislukt. Wat is er gebeurd?',
    description: "Benoem vooraf de risico's vanuit elk perspectief en bedenk maatregelen.",
    clusters: ['Markt & klant', 'Techniek', 'Mensen & organisatie', 'Financieel', 'Maatregelen'] },
  { key: 'vrij', title: 'Vrije brainstorm', question: '', description: '', clusters: ['Ideeën'] },
];
const MAX_VOTES = 5;

// ---------------------------------------------------------------------------
// Toestand
// ---------------------------------------------------------------------------
const S = {
  cap: {}, me: null, canWrite: null, readOnly: false,
  members: {}, boards: [], ideas: [], items: [], opps: [],
  loaded: new Set(), slow: false, dbError: null,
  profiles: {}, peers: [],
  board: null, tab: 'ideeen',
  ui: { openIdea: null, lensFilter: null, showParked: false, showArchived: false, newBoard: false, template: 'horizon', editHeader: false, addCluster: false, renameCluster: null, changeRole: false },
  drafts: {}, aiBusy: null, aiStream: '', modal: null, saving: 0, saveError: false,
};
try { S.ui.helpDismissed = localStorage.getItem('bs-help-dismissed') === '1'; } catch { S.ui.helpDismissed = false; }
const root = document.getElementById('app');
const COLLECTIONS = ['members', 'boards', 'ideas', 'items', 'opportunities'];

// ---------------------------------------------------------------------------
// Hulpfuncties
// ---------------------------------------------------------------------------
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const attr = esc;
const sum = (o) => Object.values(o ?? {}).reduce((a, b) => a + (Number(b) || 0), 0);
const avg = (l) => { const v = l.filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const draft = (k, fallback = '') => S.drafts[k] ?? fallback;
const nowIso = () => new Date().toISOString();
const uid = () => Math.random().toString(36).slice(2, 10);
const board = () => S.boards.find((b) => b.id === S.board) ?? null;
const boardIdeas = () => S.ideas.filter((i) => i.boardId === S.board);
const boardItems = (kind) => S.items.filter((i) => i.boardId === S.board && i.kind === kind).sort((a, b) => (a.createdAt ?? '').localeCompare(b.createdAt ?? ''));
const roleOf = (id) => S.members[id]?.role ?? null;
const myRole = () => roleOf(S.me);
const memberForRole = (role) => Object.keys(S.members).find((id) => S.members[id].role === role) ?? null;
const roster = () => ROLE_KEYS.map((role) => ({ role, id: memberForRole(role) }));

function nameOf(id) {
  if (!id) return 'Iemand';
  return S.profiles[id]?.name || (roleOf(id) ? ROLES[roleOf(id)].label : 'Iemand');
}
const firstName = (id) => nameOf(id).split(' ')[0];

function initials(name) {
  const p = name.trim().split(/\s+/);
  return ((p[0]?.[0] ?? '') + (p.length > 1 ? p.at(-1)[0] : p[0]?.[1] ?? '')).toUpperCase();
}

function avatar(id, { size = '', online = null, role = null } = {}) {
  const r = ROLES[role ?? roleOf(id)];
  const cls = ['avatar', size, online === true && 'online', !id && 'vacant'].filter(Boolean).join(' ');
  const p = id && S.profiles[id];
  const title = id ? `${nameOf(id)}${r ? ` — ${r.label}` : ''}` : r ? `${r.label} (nog vrij)` : '';
  const inner = p?.avatarUrl ? `<img src="${attr(p.avatarUrl)}" alt="">` : esc(id ? initials(nameOf(id)) : r?.short ?? '?');
  const status = id && online === true ? ', online' : '';
  return `<span class="${cls}" style="--c:${r?.color ?? 'var(--muted)'}; --ci:${r?.ink ?? 'var(--muted)'}" title="${attr(title + status)}" role="img" aria-label="${attr(title + status)}">${inner}</span>`;
}
function lensTag(key) {
  const r = LENSES[key];
  return r ? `<span class="tag" style="--c:${r.color}; --ci:${r.ink}">${esc(r.lens)}</span>` : '';
}
function relTime(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'zojuist';
  if (s < 3600) return `${Math.floor(s / 60)} min geleden`;
  if (s < 86400) return `${Math.floor(s / 3600)} uur geleden`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} dagen geleden`;
  return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
}
const votesLabel = (n) => `${n} ${n === 1 ? 'stem' : 'stemmen'}`;

function md(src) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null;
  const close = () => { if (list) out.push(`</${list}>`); list = null; };
  for (const line of String(src ?? '').split('\n')) {
    let m;
    if ((m = line.match(/^#{1,6}\s+(.*)/))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (!line.trim()) close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return `<div class="md">${out.join('')}</div>`;
}
function toast(message, type = '', action = null) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  if (type === 'error') el.setAttribute('role', 'alert');
  const span = document.createElement('span');
  span.textContent = message;
  el.append(span);
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { el.remove(); action.fn(); };
    el.append(b);
  }
  document.getElementById('toasts').append(el);
  setTimeout(() => el.remove(), action ? 8000 : 4500);
}

// ---------------------------------------------------------------------------
// Opslag (db-capability)
// ---------------------------------------------------------------------------
const queues = new Map();
// Eén schrijfactie tegelijk per document.
function queue(path, fn) {
  const prev = queues.get(path) ?? Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  queues.set(path, next);
  S.saving++;
  updateSaveState();
  return next.then(() => { S.saveError = false; }, (e) => { S.saveError = true; handleWriteError(e); })
    .finally(() => { S.saving--; updateSaveState(); });
}
function saveStateHtml() {
  if (S.saveError) return '<span class="save-state error" id="save-state" role="status">Niet alles is opgeslagen</span>';
  if (S.saving > 0) return '<span class="save-state" id="save-state" role="status"><span class="spinner" aria-hidden="true"></span>Opslaan…</span>';
  return '<span class="save-state" id="save-state" role="status"><span class="dot-ok" aria-hidden="true"></span>Alles opgeslagen</span>';
}
function updateSaveState() {
  const el = document.getElementById('save-state');
  if (el) el.outerHTML = saveStateHtml();
}
function handleWriteError(e) {
  if (e?.code === 'invalid_argument' && S.canWrite !== true) {
    S.readOnly = true;
    toast('Je kunt meekijken, maar niet bewerken. Vraag de eigenaar om je als Contributor toe te voegen.', 'error');
    render();
  } else if (e?.code === 'quota_exceeded') {
    toast('De opslag van deze brainstorm is vol. Verwijder oude sessies om ruimte te maken.', 'error');
  } else if (e?.code === 'resource_exhausted') {
    toast('Even te veel wijzigingen tegelijk. Probeer het zo opnieuw.', 'error');
  } else {
    toast('Opslaan lukte niet. Probeer het opnieuw.', 'error');
    console.error(e);
  }
}
const ref = (path) => S.cap.db.doc(path);
const setDoc = (path, data) => queue(path, () => ref(path).set(data));
const updateDoc = (path, data) => queue(path, () => ref(path).update(data));
const deleteDoc = (path) => queue(path, () => ref(path).delete());
const newId = (coll) => S.cap.db.collection(coll).doc().id;
const touchBoard = (fields = {}) => S.board && updateDoc(`boards/${S.board}`, { ...fields, updatedAt: nowIso() });

function guardWrite() {
  if (S.readOnly || S.canWrite === false) {
    toast('Je kunt meekijken, maar niet bewerken. Vraag de eigenaar om je als Contributor toe te voegen.');
    return false;
  }
  if (!S.members[S.me]) { S.ui.changeRole = true; render(); return false; }
  return true;
}

function subscribe() {
  const db = S.cap.db;
  const timer = setTimeout(() => { if (S.loaded.size < COLLECTIONS.length) { S.slow = true; render(); } }, 10_000);
  for (const coll of COLLECTIONS) {
    db.collection(coll).onSnapshot((snap) => {
      const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (coll === 'boards' && S.board && document.activeElement?.id === 'board-notes' && S.notesBase != null) {
        const after = rows.find((x) => x.id === S.board);
        if (after && (after.notes ?? '') !== S.notesBase && after.notesBy !== S.me) S.notesConflict = 'live';
      }
      if (coll === 'boards' && S.board) {
        const before = S.boards.find((x) => x.id === S.board);
        const after = rows.find((x) => x.id === S.board);
        if (before && after && stepOf(before) !== stepOf(after) && after.phaseBy && after.phaseBy !== S.me) {
          const step = STEPS.find((x) => x.key === stepOf(after));
          toast(`${firstName(after.phaseBy)} zette het team op stap ${STEP_KEYS.indexOf(step.key) + 1}: ${step.label}.`, '', S.tab === step.key ? null : { label: 'Ga erheen', fn: () => { S.tab = step.key; render(); } });
        }
      }
      if (coll === 'members') S.members = Object.fromEntries(rows.map((r) => [r.id, r]));
      else if (coll === 'opportunities') S.opps = rows;
      else S[coll] = rows;
      if (!snap.metadata.fromCache) S.loaded.add(coll);
      if (S.loaded.size === COLLECTIONS.length) { clearTimeout(timer); S.slow = false; }
      scheduleProfiles();
      render();
    }, (e) => {
      clearTimeout(timer);
      S.dbError = e.code;
      render();
    });
  }
}

let profileTimer = null;
function scheduleProfiles() {
  clearTimeout(profileTimer);
  profileTimer = setTimeout(async () => {
    if (!S.cap.user) return;
    const ids = new Set(Object.keys(S.members));
    for (const i of S.ideas) { ids.add(i.authorId); for (const c of Object.values(i.comments ?? {})) ids.add(c?.authorId); }
    for (const b of S.boards) ids.add(b.createdBy);
    for (const it of S.items) { ids.add(it.by); ids.add(it.ownerId); }
    for (const o of S.opps) ids.add(o.ownerId);
    for (const p of S.peers) ids.add(p.by);
    if (S.me) ids.add(S.me);
    const list = [...ids].filter((x) => typeof x === 'string' && x);
    if (!list.length) return;
    const ps = await S.cap.user.profiles(list);
    const changed = list.some((id) => S.profiles[id]?.name !== ps[id]?.name || S.profiles[id]?.avatarUrl !== ps[id]?.avatarUrl);
    S.profiles = { ...S.profiles, ...ps };
    if (changed) render();
  }, 60);
}

function readHash() {

function go(boardId) {
  location.hash = boardId ? `s-${boardId}` : '';

function onRoute() {
  const prev = S.board;

  render();
}

// Tekenen is niet herintreedbaar: komt er tijdens het tekenen (bijv. via een focus-event) nog een
// verzoek binnen, dan volgt één extra ronde zodra de huidige klaar is.
let rendering = false;
let renderAgain = false;
function render() {
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; queueMicrotask(render); }
}
function renderNow() {
  let html;
  if (!S.started) html = '<div class="loading">Brainstorm laden…</div>';
  else if (!S.cap.db) html = renderNoRuntime();
  else if (S.dbError) html = `<main class="center"><div class="panel"><h2>De gegevens zijn niet bereikbaar</h2><p class="muted">Herlaad de pagina. Lukt het dan nog niet, controleer of je nog toegang hebt tot deze brainstorm.</p></div></main>`;
  else if (S.loaded.size < COLLECTIONS.length && !S.boards.length && !Object.keys(S.members).length) html = `<div class="loading">${S.slow ? 'De gegevens zijn nog niet bereikbaar. Controleer je verbinding.' : 'Brainstorm laden…'}</div>`;
  else if (!S.me) html = renderNoIdentity();
  else if ((!S.members[S.me] && S.canWrite !== false && !S.readOnly) || S.ui.changeRole) html = appbar() + renderRolePicker();
  else if (S.board && board()) html = appbar() + renderBoard();
  else html = appbar() + renderHome();
  if (S.modal) html += renderModal();

  const target = document.createElement('div');
  target.id = 'app';
  target.innerHTML = html;
  if (window.morphdom) {
    window.morphdom(root, target, {
      onBeforeElUpdated(from, to) {
        if (from === document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(from.tagName)) return false;
        return !from.isEqualNode(to);
      },
    });
  } else {
    root.innerHTML = html;
  }
  manageFocus();
  tickTimer();
}

// Dialoog open: de rest van de pagina is niet bedienbaar (inert) en de focus gaat de dialoog in.
// Dialoog dicht: de focus keert terug naar de knop waarmee hij geopend werd.
let lastOverlay = null;
let returnFocusTo = null;
function manageFocus() {
  const overlay = S.modal ? 'modal' : S.ui.openIdea ? 'drawer' : null;
  // Eerst onthouden waar de focus stond: inert maken haalt de focus weg.
  if (overlay && !lastOverlay && !returnFocusTo && document.activeElement && document.activeElement !== document.body) {
    const a = document.activeElement;
    returnFocusTo = { el: a, domId: a.id, id: a.dataset?.id, action: a.dataset?.action };
  }
  for (const el of root.querySelectorAll(':scope > header, :scope > main, :scope > .center')) el.inert = !!overlay;
  const drawer = root.querySelector('.drawer');
  if (drawer) drawer.inert = overlay === 'modal';
  if (overlay !== lastOverlay) {
    if (overlay === 'modal') root.querySelector('#modal-cancel')?.focus();
    else if (overlay === 'drawer') drawer?.focus();
    else if (!overlay && returnFocusTo) {
      const t = (returnFocusTo.domId && document.getElementById(returnFocusTo.domId)) || (returnFocusTo.el?.isConnected ? returnFocusTo.el : null)
        || (returnFocusTo.id ? root.querySelector(`[data-action="${returnFocusTo.action}"][data-id="${CSS.escape(returnFocusTo.id)}"]`) : null);
      t?.focus();
      returnFocusTo = null;
    }
    lastOverlay = overlay;
  }
}

    <div class="row" style="gap:0.35rem">${lensTag(idea.lens)}${idea.status === 'geparkeerd' ? '' : `<button class="star" data-action="quick-shortlist" data-id="${idea.id}" aria-pressed="${idea.status === 'shortlist'}" title="${idea.status === 'shortlist' ? 'Van de shortlist halen' : 'Op de shortlist zetten'}" aria-label="${attr(`Shortlist: ${idea.text}`)}">${idea.status === 'shortlist' ? '★' : '☆'}</button>`}${idea.status === 'geparkeerd' ? '<span class="tag">geparkeerd</span>' : ''}</div>
    <button class="card-open" id="open-${idea.id}" data-action="open-idea" data-id="${idea.id}" aria-haspopup="dialog">${esc(idea.text)}</button>
    <div class="card-foot">
      ${idea.fromAi ? '<span class="tag" style="--c:var(--accent)" title="Voorgesteld door Claude">AI</span>' : avatar(idea.authorId, { size: 'sm' })}
      <span class="pdots" title="${given} van 4 perspectieven gegeven" aria-label="${given} van 4 perspectieven gegeven" role="img">${ROLE_KEYS.map((k) => `<span class="pdot ${idea.perspectives?.[k] ? 'on' : ''}" style="--c:${ROLES[k].color}"></span>`).join('')}</span>
      ${comments ? `<span>${comments} ${comments === 1 ? 'reactie' : 'reacties'}</span>` : ''}
      <span class="votes">
        ${myVotes ? `<button class="ghost" data-action="vote" data-id="${idea.id}" data-delta="-1" title="Stem terugnemen" aria-label="Stem terugnemen">−</button>` : ''}
        <span class="count ${myVotes ? 'mine' : ''}" title="${myVotes ? `waarvan ${myVotes} van jou` : ''}"><span class="sr-only">Stemmen: </span>${sum(idea.votes)}${myVotes ? `<span class="sr-only">, waarvan ${myVotes} van jou</span>` : ''}</span>
        <button class="ghost" data-action="vote" data-id="${idea.id}" data-delta="1" title="Stem op dit idee" aria-label="Stem op dit idee">▲</button>
      </span>
    </div>
  </article>`;
}

function renderIdeas(b) {
  const ideas = boardIdeas();
  const votesUsed = ideas.reduce((s, i) => s + (Number(i.votes?.[S.me]) || 0), 0);
  const q = (S.ui.query ?? '').trim().toLowerCase();
  const visible = ideas.filter((i) => (S.ui.showParked || i.status !== 'geparkeerd') && (!S.ui.lensFilter || i.lens === S.ui.lensFilter)
    && (!q || `${i.text} ${i.details ?? ''}`.toLowerCase().includes(q)));
  const filtering = q || S.ui.lensFilter;
  const clusters = b.clusters ?? [];
  return `<div class="panel">
    <div class="composer">
      <textarea id="idea-text" maxlength="280" data-counter="idea-count" data-draft="idea.text" data-enter="add-idea" rows="2" aria-describedby="idea-count" placeholder="Nieuw idee… (Enter = toevoegen, Shift+Enter = nieuwe regel)">${esc(draft('idea.text'))}</textarea>
      <select id="idea-cluster" data-draft="idea.cluster" aria-label="Thema">${clusters.map((c) => `<option value="${c.id}" ${draft('idea.cluster') === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <select id="idea-lens" data-draft="idea.lens" aria-label="Perspectief">
        <option value="">Geen specifiek perspectief</option>
        ${lensOptions(draft('idea.lens', myRole()))}
      </select>
      <button class="primary" data-action="add-idea">Toevoegen</button>
    </div>
    <div class="counter" id="idea-count" aria-live="off">${draft('idea.text').length}/280</div>
  </div>
  <div class="row" style="margin:0.9rem 0">
    <label for="idea-search" class="sr-only">Zoek in ideeën</label>
    <input id="idea-search" type="search" value="${attr(S.ui.query ?? '')}" placeholder="Zoek in ideeën…" style="width:min(220px, 100%)">
    <label for="lens-filter" class="small" style="margin:0">Toon</label>
    <select id="lens-filter" data-change="lens-filter" style="width:auto">
      <option value="">Alle perspectieven</option>
      ${lensOptions(S.ui.lensFilter)}
    </select>
    <label class="row small" style="margin:0 0 0 0.5rem; gap:0.3rem" for="show-parked"><input id="show-parked" type="checkbox" style="width:auto" data-change="toggle-parked" ${S.ui.showParked ? 'checked' : ''}> geparkeerd tonen</label>
    <span class="spacer"></span>
    <span class="small" aria-live="polite">Je hebt nog <strong>${MAX_VOTES - votesUsed}</strong> van ${MAX_VOTES} stemmen</span>
    ${S.ui.addCluster ? `<input id="new-cluster" maxlength="60" data-draft="cluster.name" data-enter="add-cluster" value="${attr(draft('cluster.name'))}" placeholder="Naam van het thema" style="width:200px"><button class="sm primary" data-action="add-cluster">Toevoegen</button><button class="sm ghost" data-action="toggle-add-cluster">Annuleren</button>`
      : '<button class="sm" data-action="toggle-add-cluster">+ Thema</button>'}
  </div>
  ${renderAiStrip(b)}
  ${filtering ? `<p class="small" role="status" style="margin:0 0 0.6rem">${visible.length} van ${ideas.length} ideeën zichtbaar. <button class="sm ghost" data-action="clear-filter">Filters wissen</button></p>` : ''}
  ${ideas.length ? `<div class="columns">${clusters.map((c) => {
      const list = sortedIdeas(visible.filter((i) => i.clusterId === c.id || (!clusters.some((x) => x.id === i.clusterId) && c === clusters[0])));
      return `<section class="column">
        <div class="column-head">
          ${S.ui.renameCluster === c.id ? `<input id="rename-${c.id}" data-draft="rename.${c.id}" data-enter="save-cluster" data-id="${c.id}" value="${attr(draft(`rename.${c.id}`, c.name))}"><button class="sm primary" data-action="save-cluster" data-id="${c.id}">Opslaan</button>`
            : `<h2>${esc(c.name)} <span class="muted">${list.length}</span></h2>
              <button class="ghost icon sm" data-action="rename-cluster" data-id="${c.id}" title="Hernoemen" aria-label="Thema hernoemen">✎</button>
              <button class="ghost icon sm" data-action="remove-cluster" data-id="${c.id}" title="Verwijderen" aria-label="Thema verwijderen">✕</button>`}
        </div>
        ${list.map(ideaCard).join('') || '<div class="muted small" style="padding:0.4rem">Nog leeg</div>'}
      </section>`;
    }).join('')}</div>`
    : `<div class="panel empty-state"><p><strong>Nog geen ideeën.</strong></p><p>Tip: zet een timebox van 10 minuten en schrijf ieder zoveel mogelijk ideeën op, nog zonder te oordelen.</p></div>`}`;
}

function lensOptions(selected) {
  const opt = (k) => `<option value="${k}" ${selected === k ? 'selected' : ''}>${esc(LENSES[k].lens)}</option>`;
  return `<optgroup label="Rollen in het team">${ROLE_KEYS.map(opt).join('')}</optgroup><optgroup label="Extra perspectieven">${EXTRA_KEYS.map(opt).join('')}</optgroup>`;
}

function renderAiStrip(b) {
  if (!S.cap.sample) return '';
  const suggestions = boardItems('suggestion');
  return `<div class="ai-strip">
    <div class="row">
      <strong>Laat Claude meedenken</strong>
      <span class="muted small">Ideeën vanuit alle vier de perspectieven, ook buiten de ServiceNow-wereld.</span>
      <span class="spacer"></span>
      <input id="ai-focus" maxlength="300" data-draft="ai.focus" value="${attr(draft('ai.focus'))}" placeholder="Optioneel: focus (bijv. zorgsector, Microsoft, AI-agents)" style="max-width:360px">
      <button class="primary sm" data-action="ai-ideas" ${S.aiBusy ? 'disabled' : ''}>Genereer ideeën</button>
    </div>
    ${suggestions.length ? `<div class="suggestions">${suggestions.map((s) => `<div class="suggestion">
        <div class="row">${lensTag(s.lens)}<span class="spacer"></span><span class="badge">${esc((b.clusters ?? []).find((c) => c.id === s.clusterId)?.name ?? '')}</span></div>
        <p><strong>${esc(s.text)}</strong></p>
        <p class="muted small">${esc(s.details)}</p>
        <div class="row"><button class="sm primary" data-action="accept-suggestion" data-id="${s.id}">Op het bord</button><button class="sm ghost" data-action="dismiss-suggestion" data-id="${s.id}">Negeren</button></div>
      </div>`).join('')}</div>` : ''}
  </div>`;
}

function sentimentLabel(x) { return { kans: 'Kans', neutraal: 'Neutraal', zorg: 'Zorg' }[x] ?? ''; }

function renderPerspectives() {
  let ideas = boardIdeas().filter((i) => i.status === 'shortlist');
  const usingShortlist = ideas.length > 0;
  if (!usingShortlist) ideas = sortedIdeas(boardIdeas().filter((i) => i.status !== 'geparkeerd')).slice(0, 8);
  const mine = myRole();
  const cols = S.ui.showExtra ? LENS_KEYS : ROLE_KEYS;
  return `<div class="lens-grid">${ROLE_KEYS.map((k) => {
      const r = ROLES[k];
      return `<div class="panel lens-card" style="--c:${r.color}"><div class="row">${avatar(memberForRole(k), { size: 'sm', role: k })}<strong>${esc(r.lens)}</strong></div><ul>${r.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ul></div>`;
    }).join('')}</div>
  <div class="row" style="margin-bottom:0.6rem">
    <p class="muted small" style="margin:0; flex:1; min-width:min(280px, 100%)">${usingShortlist ? `De ${ideas.length} ${ideas.length === 1 ? 'idee' : 'ideeën'} op de shortlist. Kies een vakje om een perspectief te geven of te lezen.` : 'Nog geen shortlist. Hieronder de ideeën met de meeste stemmen. Zet ideeën op de ★ shortlist om gericht te bespreken.'}</p>
    <label class="row small" style="margin:0; gap:0.3rem" for="show-extra"><input id="show-extra" type="checkbox" style="width:auto" data-change="toggle-extra" ${S.ui.showExtra ? 'checked' : ''}> Toon ook klant, commercie en risico</label>
  </div>
  ${ideas.length ? `<div class="panel table-scroll"><table class="ptable" style="min-width:${cols.length > 4 ? 1100 : 760}px">
    <thead><tr><th class="idea-col" scope="col">Idee</th>${cols.map((k) => `<th scope="col" style="--ci:${LENSES[k].ink}">${esc(ROLES[k] ? ROLES[k].label : LENSES[k].label)}</th>`).join('')}</tr></thead>
    <tbody>${ideas.map((idea) => {
      const counts = { kans: 0, zorg: 0 };
      for (const k of ROLE_KEYS) { const p = idea.perspectives?.[k]; if (p) counts[p.sentiment] = (counts[p.sentiment] ?? 0) + 1; }
      return `<tr>
        <th scope="row" style="font-weight:400"><button class="pcell idea" data-action="open-idea" data-id="${idea.id}" aria-haspopup="dialog"><span class="clamp"><strong>${esc(idea.text)}</strong></span><span class="muted small">▲ ${sum(idea.votes)} · <span class="sentiment-kans">${counts.kans} kans</span> · <span class="sentiment-zorg">${counts.zorg} zorg</span></span></button></th>
        ${cols.map((k) => {
          const p = idea.perspectives?.[k];
          const canWrite = EXTRA[k] || k === mine;
          const empty = canWrite ? (k === mine ? '+ Jouw perspectief' : '+ Invullen') : 'Nog niet ingevuld';
          return `<td><button class="pcell ${p ? esc(p.sentiment) : 'empty'} ${canWrite ? 'mine' : ''}" data-action="open-idea" data-id="${idea.id}" aria-haspopup="dialog" aria-label="${attr(`${LENSES[k].label} over ${idea.text}: ${p ? `${sentimentLabel(p.sentiment)}. ${p.text}` : 'nog niet ingevuld'}`)}"><span class="clamp">${p ? `<span class="lbl">${sentimentLabel(p.sentiment)}:</span> ${esc(p.text)}` : empty}</span></button></td>`;
        }).join('')}
      </tr>`;
    }).join('')}</tbody></table></div>` : '<div class="panel empty-state">Voeg eerst ideeën toe bij stap 1.</div>'}`;
}

function ratingStats(idea) {
  const r = Object.values(idea.ratings ?? {}).filter((x) => x && (x.impact != null || x.effort != null));
  return { impact: avg(r.map((x) => x.impact)), effort: avg(r.map((x) => x.effort)), n: r.length };
}
function scale(ideaId, field, value) {
  return `<span class="scale" role="group" aria-label="${field === 'impact' ? 'Impact' : 'Inspanning'}">${[1, 2, 3, 4, 5].map((n) => `<button class="${value === n ? 'on' : ''}" aria-pressed="${value === n}" data-action="rate" data-id="${ideaId}" data-field="${field}" data-value="${value === n ? '' : n}" aria-label="${field === 'impact' ? 'Impact' : 'Inspanning'} ${n}" title="${value === n ? 'Klik om te wissen' : ''}">${n}</button>`).join('')}</span>`;
}

function renderMatrix() {
  const ideas = sortedIdeas(boardIdeas().filter((i) => i.status !== 'geparkeerd'));
  const numbered = ideas.map((idea, i) => ({ idea, num: i + 1, ...ratingStats(idea) }));
  const rated = numbered.filter((x) => x.impact != null && x.effort != null);
  const mineCount = ideas.filter((i) => i.ratings?.[S.me]).length;
  const score = (x) => x.impact - x.effort * 0.5;
  const ranking = [...rated].sort((a, b) => score(b) - score(a));
  return `<div class="matrix-wrap">
    <div class="stack" style="gap:1rem">
      <div class="panel">
        <h2>Impact × inspanning</h2>
        <p class="muted small">Gemiddelde van alle scores. Linksboven zitten de quick wins.</p>
        <div class="matrix">
          <div class="quad">Quick wins</div><div class="quad">Grote projecten</div><div class="quad">Opvullers</div><div class="quad">Tijdvreters</div>
          ${rated.map((x) => {
            const left = ((x.effort - 1) / 4) * 92 + 4;
            const bottom = ((x.impact - 1) / 4) * 92 + 4;
            const color = LENSES[x.idea.lens]?.color ?? 'var(--accent)';
            const label = `${x.num}. ${x.idea.text}: impact ${x.impact.toFixed(1)}, inspanning ${x.effort.toFixed(1)}, ${x.n} van 4 partners`;
            return `<button class="dot" style="left:${left}%; bottom:${bottom}%; --c:${color}" data-action="open-idea" data-id="${x.idea.id}" title="${attr(label)}" aria-label="${attr(label)}">${x.num}</button>`;
          }).join('')}
          ${rated.length ? '' : '<div class="matrix-empty"><span>Nog geen scores. Geef elk idee rechts een score voor impact en inspanning; dan verschijnt het hier.</span></div>'}
        </div>
        <div class="axis"><span>← weinig inspanning</span><span>veel inspanning →</span></div>
      </div>
      ${ranking.length ? `<div class="panel table-scroll">
        <h2>Ranglijst</h2>
        <p class="muted small">Gesorteerd op impact min de helft van de inspanning.</p>
        <table class="list"><thead><tr><th>#</th><th>Idee</th><th>▲</th><th>Impact</th><th>Inspanning</th><th>Partners</th></tr></thead>
        <tbody>${ranking.map((x) => `<tr><td><span class="num">${x.num}</span></td><td><a href="#" data-action="open-idea" data-id="${x.idea.id}">${esc(x.idea.text)}</a></td><td class="n">${sum(x.idea.votes)}</td><td class="n">${x.impact.toFixed(1)}</td><td class="n">${x.effort.toFixed(1)}</td><td class="n">${x.n}/4</td></tr>`).join('')}</tbody></table>
      </div>` : ''}
    </div>
    <div class="panel">
      <h2>Jouw scores</h2>
      <p class="muted small">Je hebt ${mineCount} van de ${ideas.length} ideeën gescoord. Impact: hoeveel waarde levert het op? Inspanning: hoeveel tijd, geld en mensen kost het?</p>
      ${numbered.map(({ idea, num }) => {
        const r = idea.ratings?.[S.me] ?? {};
        return `<div class="rate-row"><span class="num">${num}</span><span class="small">${esc(idea.text)}</span>
          <span class="scales"><span>impact ${scale(idea.id, 'impact', r.impact)}</span><span>inspanning ${scale(idea.id, 'effort', r.effort)}</span></span></div>`;
      }).join('') || '<div class="empty-state">Nog geen ideeën om te scoren.</div>'}
    </div>
  </div>`;
}

function renderActions(b) {
  const decisions = boardItems('decision');
  const actions = boardItems('action');
  const people = roster().filter((x) => x.id);
  return `<div class="grid-2">
    <div class="stack" style="gap:1.25rem">
      <div class="panel">
        <h2>Besluiten</h2>
        ${decisions.length ? '' : '<p class="muted small">Wat hebben we samen besloten?</p>'}
        <ul style="padding-left:1.1rem">${decisions.map((d) => `<li style="margin-bottom:0.3rem">${esc(d.text)} <span class="muted small">— ${esc(firstName(d.by))}</span> <button class="ghost icon sm" data-action="remove-item" data-id="${d.id}" aria-label="Besluit verwijderen">✕</button></li>`).join('')}</ul>
        <div class="row"><input id="decision-text" maxlength="500" data-draft="decision.text" data-enter="add-decision" value="${attr(draft('decision.text'))}" placeholder="Nieuw besluit…" style="flex:1"><button data-action="add-decision">Toevoegen</button></div>
      </div>
      <div class="panel">
        <h2>Acties</h2>
        <div class="table-scroll"><table class="list"><tbody>
          ${actions.map((a) => `<tr class="${a.done ? 'done' : ''}">
            <td style="width:1.5rem"><input type="checkbox" style="width:auto" aria-label="Afgerond" data-change="toggle-action" data-id="${a.id}" ${a.done ? 'checked' : ''}></td>
            <td class="text">${esc(a.text)}</td>
            <td><select data-change="action-owner" data-id="${a.id}" aria-label="${attr(`Eigenaar van ${a.text}`)}">${people.map(({ id }) => `<option value="${attr(id)}" ${a.ownerId === id ? 'selected' : ''}>${esc(firstName(id))}</option>`).join('')}${people.some((x) => x.id === a.ownerId) ? '' : `<option value="${attr(a.ownerId)}" selected>${esc(firstName(a.ownerId))}</option>`}</select></td>
            <td><input type="date" data-change="action-due" data-id="${a.id}" value="${attr(a.due ?? '')}" aria-label="${attr(`Deadline van ${a.text}`)}"></td>
            <td><button class="ghost icon sm" data-action="remove-item" data-id="${a.id}" aria-label="Actie verwijderen">✕</button></td>
          </tr>`).join('')}
        </tbody></table></div>
        <div class="row" style="margin-top:0.6rem">
          <input id="action-text" maxlength="300" data-draft="action.text" data-enter="add-action" value="${attr(draft('action.text'))}" placeholder="Wat moet er gebeuren?" style="flex:2; min-width:180px">
          <select id="action-owner" data-draft="action.owner" style="flex:1; min-width:110px" aria-label="Eigenaar">
            ${people.map(({ id }) => `<option value="${attr(id)}" ${draft('action.owner', S.me) === id ? 'selected' : ''}>${esc(firstName(id))}</option>`).join('')}
          </select>
          <input id="action-due" type="date" data-draft="action.due" value="${attr(draft('action.due'))}" style="flex:1; min-width:140px" aria-label="Deadline">
          <button data-action="add-action">Toevoegen</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>Sessienotities</h2>
      <p class="muted small">Gedeeld kladblok. Wordt opgeslagen zodra je buiten het veld klikt.</p>
      <div id="notes-status" aria-live="polite">${notesTypers().length ? `<div class="typing">${notesTypers().map((id) => esc(firstName(id))).join(' en ')} ${notesTypers().length === 1 ? 'typt' : 'typen'} ook in de notities.</div>` : ''}${S.notesConflict === 'live' ? `<div class="notes-warning">${esc(firstName(b.notesBy))} heeft de notities net aangepast. Als je straks opslaat, kies je wat er bewaard blijft.</div>` : ''}${S.notesConflict === 'choose' ? `<div class="notes-warning" role="alert">
        <div>${esc(firstName(b.notesBy))} heeft de notities aangepast terwijl jij typte. Wat wil je bewaren?</div>
        <div class="row"><button class="sm primary" data-action="notes-both">Beide bewaren</button><button class="sm" data-action="notes-mine">Alleen mijn versie</button><button class="sm" data-action="notes-theirs">Alleen hun versie</button></div>
      </div>` : ''}</div>
      <textarea id="board-notes" maxlength="20000" data-change="board-notes" rows="18" placeholder="Aantekeningen, links, inzichten…">${esc(b.notes)}</textarea>
    </div>
  </div>`;
}

const ASK_PROMPTS = [
  'Welke markten liggen dicht bij onze ServiceNow-ervaring maar zijn nog onontgonnen?',
  'Welk perspectief ontbreekt nog in deze discussie?',
  'Wat is het meest onderschatte idee op het bord, en waarom?',
  'Maak een 90-dagenplan voor het sterkste idee.',
];

function renderAi(b) {
  if (!S.cap.sample) return `<div class="panel empty-state"><p><strong>Claude is hier niet beschikbaar.</strong></p><p>Open de brainstorm in claude.ai, ingelogd met je eigen account, om ideeën te laten genereren, ideeën kritisch te laten bevragen en sessies samen te vatten.</p></div>`;
  const thread = boardItems('qa');
  return `<div class="grid-2">
    <div class="panel">
      <h2>Vraag de sparringpartner</h2>
      <p class="muted small">Claude kent de vraag, alle ideeën, perspectieven en notities van deze sessie. Het gesprek is zichtbaar voor het hele team; Claude draait op het account van wie de vraag stelt.</p>
      <div class="thread">
        ${thread.map((t) => `<div class="q-bubble"><div class="small" style="opacity:0.8">${esc(firstName(t.by))}</div>${esc(t.question)}</div><div class="a-bubble">${md(t.answer)}</div>`).join('')}
        ${S.aiBusy === 'ask' ? `<div class="q-bubble"><div class="small" style="opacity:0.8">${esc(firstName(S.me))}</div>${esc(S.pendingQuestion ?? '')}</div><div class="a-bubble">${S.aiStream ? md(S.aiStream) : '<span class="muted">Claude denkt na…</span>'}</div>` : ''}
      </div>
      <div class="row" style="margin-bottom:0.5rem">${ASK_PROMPTS.map((p) => `<button class="chip" data-action="ask-preset" data-q="${attr(p)}" ${S.aiBusy ? 'disabled' : ''}>${esc(p)}</button>`).join('')}</div>
      <div class="row">
        <textarea id="ai-question" maxlength="2000" data-draft="ai.question" data-enter="ai-ask" rows="2" placeholder="Stel een vraag…" style="flex:1">${esc(draft('ai.question'))}</textarea>
        <button class="primary" data-action="ai-ask" ${S.aiBusy ? 'disabled' : ''}>Vraag</button>
      </div>
    </div>
    <div class="panel">
      <div class="row"><h2 style="margin:0">Samenvatting</h2><span class="spacer"></span>
        <button class="sm primary" data-action="ai-summary" ${S.aiBusy ? 'disabled' : ''}>${b.aiSummary ? 'Opnieuw samenvatten' : 'Vat de sessie samen'}</button>
      </div>
      ${S.aiBusy === 'summary' ? (S.aiStream ? md(S.aiStream) : '<p class="muted small" style="margin-top:0.6rem">Claude leest de sessie…</p>')
        : b.aiSummary ? `<p class="muted small">Gemaakt ${relTime(b.aiSummary.createdAt)} op verzoek van ${esc(firstName(b.aiSummary.by))}.</p>${md(b.aiSummary.text)}`
        : '<p class="muted small" style="margin-top:0.6rem">Kern, sterkste ideeën, botsende perspectieven, open vragen en voorgestelde volgende stappen.</p>'}
    </div>
  </div>`;

function perspBlock(idea, k, editable) {
  const r = LENSES[k];
  const p = idea.perspectives?.[k];
  const isRole = !!ROLES[k];
  const holder = isRole ? memberForRole(k) : null;
  const who = p ? (p.fromAi ? `Aanzet van Claude, gevraagd door ${firstName(p.by)}` : `Ingevuld door ${firstName(p.by)}`) : '';
  if (editable) {
    const sentiment = p?.sentiment ?? 'neutraal';
    const id = `persp-${k}`;
    return `<div class="persp ${p ? sentiment : ''}" style="--c:${r.color}">
      <label class="persp-head" for="${id}" style="color:var(--text)">${isRole ? `${avatar(S.me, { size: 'sm' })} Jouw blik als ${esc(r.label)}` : esc(r.label)}</label>
      <textarea rows="3" id="${id}" data-change="perspective" maxlength="2000" data-key="${k}" data-id="${idea.id}" placeholder="${attr(r.questions.join(' '))}">${esc(p?.text ?? '')}</textarea>
      <div class="row" style="margin-top:0.4rem"><span class="muted small" id="${id}-oordeel">Oordeel:</span>
        <div class="segmented" role="group" aria-labelledby="${id}-oordeel">${['kans', 'neutraal', 'zorg'].map((x) => `<button class="${p && sentiment === x ? 'on' : ''}" aria-pressed="${!!p && sentiment === x}" data-action="sentiment" data-key="${k}" data-id="${idea.id}" data-sentiment="${x}">${sentimentLabel(x)}</button>`).join('')}</div>
      </div>
      ${p && !isRole ? `<div class="meta">${esc(who)}</div>` : ''}
    </div>`;
  }
  return `<div class="persp ${p ? esc(p.sentiment) : ''}" style="--c:${r.color}">
    <div class="persp-head">${avatar(holder, { size: 'sm', role: k })} ${holder ? esc(nameOf(holder)) : esc(r.label)} <span class="muted small">· ${esc(r.lens)}</span>
      ${p ? `<span class="spacer"></span><span class="small sentiment-${esc(p.sentiment)}"><strong>${sentimentLabel(p.sentiment)}</strong></span>` : ''}</div>
    ${p ? `<div style="white-space:pre-wrap">${esc(p.text)}</div>` : '<div class="muted small">Nog geen perspectief gegeven.</div>'}
  </div>`;
}

let timerInterval = null;
let lastTimerEnd = null;
function tickTimer() {
  if (!document.getElementById('timer')) { clearInterval(timerInterval); timerInterval = null; return; }
  const update = () => {
    const t = document.getElementById('timer');
    if (!t) return;
    const left = Math.max(0, new Date(t.dataset.ends).getTime() - Date.now());
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    t.textContent = left ? `${m}:${String(s).padStart(2, '0')}` : 'Tijd!';
    t.classList.toggle('ending', left < 60_000);
    if (!left && lastTimerEnd !== t.dataset.ends) { lastTimerEnd = t.dataset.ends; toast('De tijd is om.'); }
  };
  update();
  timerInterval ??= setInterval(update, 1000);
}

function boardMarkdown(b) {
  const out = [`# ${b.title}`, ''];
  if (b.question) out.push(`**Centrale vraag:** ${b.question}`, '');
  if (b.description) out.push(b.description, '');
  out.push(`_Geëxporteerd op ${new Date().toLocaleString('nl-NL')}_`, '');
  const ranked = sortedIdeas(boardIdeas());
  for (const c of b.clusters ?? []) {
    const ideas = ranked.filter((i) => i.clusterId === c.id);
    if (!ideas.length) continue;
    out.push(`## ${c.name}`, '');
    for (const idea of ideas) {
      const st = ratingStats(idea);
      const meta = [votesLabel(sum(idea.votes)), st.impact != null && `impact ${st.impact.toFixed(1)}`, st.effort != null && `inspanning ${st.effort.toFixed(1)}`, idea.status !== 'open' && idea.status, `door ${idea.fromAi ? 'Claude' : nameOf(idea.authorId)}`].filter(Boolean);
      out.push(`### ${idea.text}`, `_${meta.join(' · ')}_`, '');
      if (idea.details) out.push(idea.details, '');
      for (const k of LENS_KEYS) { const p = idea.perspectives?.[k]; if (p) out.push(`- **${LENSES[k].label}** (${p.sentiment}${p.fromAi ? ', aanzet van Claude' : ''}): ${p.text}`); }
      for (const cm of Object.values(idea.comments ?? {}).filter(Boolean)) out.push(`- Reactie van ${nameOf(cm.authorId)}: ${cm.text}`);
      out.push('');
    }
  }
  const decisions = boardItems('decision');
  if (decisions.length) out.push('## Besluiten', '', ...decisions.map((d) => `- ${d.text}`), '');
  const actions = boardItems('action');
  if (actions.length) { out.push('## Acties', ''); for (const a of actions) out.push(`- [${a.done ? 'x' : ' '}] ${a.text} — ${nameOf(a.ownerId)}${a.due ? ` (voor ${a.due})` : ''}`); out.push(''); }
  if (b.notes) out.push('## Sessienotities', '', b.notes, '');
  if (b.aiSummary) out.push('## Samenvatting door Claude', '', b.aiSummary.text, '');
  return out.join('\n');
}

Het team:

Werkwijze: schrijf in het Nederlands, zakelijk maar informeel (je/jullie). Wees concreet en noem waar relevant echte platformen, markten, standaarden of bedrijfsmodellen. Durf tegen te spreken en blinde vlekken te benoemen. Houd het compact, zonder inleidende of afsluitende beleefdheidszinnen.`;

function boardContext(b) {
  const cl = (cid) => (b.clusters ?? []).find((c) => c.id === cid)?.name ?? 'Overig';
  const lines = [`# Sessie: ${b.title}`, b.question && `Centrale vraag: ${b.question}`, b.description && `Context: ${b.description}`, `Thema's: ${(b.clusters ?? []).map((c) => c.name).join(', ')}`, '', '## Ideeën'];
  const ideas = boardIdeas();
  if (!ideas.length) lines.push('(nog geen ideeën)');
  for (const idea of ideas) {
    lines.push(`- (${cl(idea.clusterId)}; ${votesLabel(sum(idea.votes))}; status ${idea.status}) ${idea.text}`);
    if (idea.details) lines.push(`  Toelichting: ${idea.details}`);
    for (const k of LENS_KEYS) { const p = idea.perspectives?.[k]; if (p) lines.push(`  Perspectief ${LENSES[k].label} (${p.sentiment}${p.fromAi ? ', aanzet van AI' : ''}): ${p.text}`); }
    for (const c of Object.values(idea.comments ?? {}).filter(Boolean).slice(-5)) lines.push(`  Reactie: ${c.text}`);
  }
  const decisions = boardItems('decision');
  if (decisions.length) lines.push('', '## Besluiten', ...decisions.map((d) => `- ${d.text}`));
  if (b.notes) lines.push('', '## Sessienotities', b.notes.slice(0, 6000));
  return lines.filter((l) => typeof l === 'string').join('\n').slice(0, 60_000);
}

let aiCtl = null;
async function runAi(kind, fn, target = null) {
  if (!S.cap.sample || S.aiBusy) return;
  if (!guardWrite()) return;
  aiCtl = new AbortController();
  S.aiBusy = kind; S.aiTarget = target; S.aiStream = '';
  render();
  try {
    await fn(aiCtl.signal);
  } catch (e) {
    const msg = {
      cancelled: null,
      not_granted: 'Claude heeft geen toestemming gekregen voor deze pagina.',
      sampling_disabled: 'Claude is niet beschikbaar voor dit account.',
      rate_limited: 'Je hebt Claude net vaak gebruikt. Probeer het over een paar minuten opnieuw.',
      refused: 'Claude wilde dit verzoek niet beantwoorden. Formuleer de vraag anders.',
      invalid_json: 'Het antwoord van Claude kon niet worden verwerkt. Probeer het opnieuw.',
      session_expired: 'Je sessie is verlopen. Log opnieuw in op claude.ai.',
    }[e?.code] ?? (e?.code ? 'Claude gaf een fout. Probeer het opnieuw.' : null);
    if (msg) toast(msg, 'error');
    if (!e?.code) console.error(e);
  } finally {
    S.aiBusy = null; S.aiTarget = null; S.aiStream = ''; S.pendingQuestion = null;
    render();
  }
}
