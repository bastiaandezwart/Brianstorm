    const b = board();
    if ((b.clusters ?? []).length <= 1) return toast('Er moet minstens één thema blijven.');
    confirmModal('Thema verwijderen?', 'De ideeën in dit thema verhuizen naar het eerste overgebleven thema.', 'Verwijderen', async () => {
      const rest = b.clusters.filter((c) => c.id !== el.dataset.id);
      await touchBoard({ clusters: rest });
      for (const i of boardIdeas().filter((x) => x.clusterId === el.dataset.id)) updateDoc(`ideas/${i.id}`, { clusterId: rest[0].id });
    });
  },
  vote(el) {
    if (!guardWrite()) return;
    const idea = boardIdeas().find((i) => i.id === el.dataset.id);
    if (!idea) return;
    const delta = Number(el.dataset.delta) < 0 ? -1 : 1;
    const used = boardIdeas().reduce((s, i) => s + (Number(i.votes?.[S.me]) || 0), 0);
    if (delta > 0 && used >= MAX_VOTES) return toast(`Je hebt al je ${MAX_VOTES} stemmen gebruikt. Neem er eerst een terug.`);
    const next = Math.max(0, (Number(idea.votes?.[S.me]) || 0) + delta);
    updateDoc(`ideas/${idea.id}`, { votes: { [S.me]: next } });
  },
  'open-idea'(el, e) {
    e.preventDefault();
    returnFocusTo = { el, domId: el.id, id: el.dataset.id, action: 'open-idea' };
    S.ui.openIdea = el.dataset.id;
    render();
  },
  'close-idea'() { S.ui.openIdea = null; render(); },
  'quick-shortlist'(el) {
    if (!guardWrite()) return;
    const idea = boardIdeas().find((i) => i.id === el.dataset.id);
    if (idea) updateDoc(`ideas/${idea.id}`, { status: idea.status === 'shortlist' ? 'open' : 'shortlist' });
  },
  'idea-status'(el) { if (guardWrite()) updateDoc(`ideas/${el.dataset.id}`, { status: el.dataset.status }); },
  sentiment(el) {
    if (!guardWrite()) return;
    const k = el.dataset.key;
    if (ROLES[k] && k !== myRole()) return;
    const text = document.getElementById(`persp-${k}`)?.value.trim();
    if (!text) { document.getElementById(`persp-${k}`)?.focus(); return toast('Schrijf eerst het perspectief op.'); }
    updateDoc(`ideas/${el.dataset.id}`, { perspectives: { [k]: { text: text.slice(0, 2000), sentiment: el.dataset.sentiment, by: S.me, fromAi: false, updatedAt: nowIso() } } });
  },
  rate(el) {
    if (!guardWrite()) return;
    const value = el.dataset.value ? Number(el.dataset.value) : null;
    updateDoc(`ideas/${el.dataset.id}`, { ratings: { [S.me]: { [el.dataset.field]: value } } });
  },
  'add-comment'(el) {
    if (!guardWrite()) return;
    const key = `comment.${el.dataset.id}`;
    const text = draft(key).trim();
    if (!text) return;
    updateDoc(`ideas/${el.dataset.id}`, { comments: { [uid()]: { authorId: S.me, text: text.slice(0, 1000), createdAt: nowIso() } } });
    clearDraft(key);
  },
  'remove-idea'(el) {
    if (!guardWrite()) return;
    confirmModal('Idee verwijderen?', 'Het idee verdwijnt met alle stemmen, perspectieven en reacties.', 'Verwijderen', () => {
      S.ui.openIdea = null;
      deleteDoc(`ideas/${el.dataset.id}`);
    });
  },
  async 'to-radar'(el) {
    if (!guardWrite()) return;
    const idea = boardIdeas().find((i) => i.id === el.dataset.id);
    await setDoc(`opportunities/${newId('opportunities')}`, { title: idea.text, description: idea.details ?? '', stage: 'verkennen', ownerId: S.me, source: { boardId: S.board, ideaId: idea.id }, createdAt: nowIso() });
    toast('Toegevoegd aan de kansenradar.');
  },
  async 'accept-suggestion'(el) {
    if (!guardWrite()) return;
    const s = boardItems('suggestion').find((x) => x.id === el.dataset.id);
    if (!s) return;
    await setDoc(`ideas/${newId('ideas')}`, {
      boardId: S.board, text: s.text, details: s.details ?? '', clusterId: s.clusterId, lens: s.lens, authorId: S.me,
      createdAt: nowIso(), status: 'open', fromAi: true, votes: {}, ratings: {}, perspectives: {}, comments: {},
    });
    deleteDoc(`items/${s.id}`);
  },
  'dismiss-suggestion'(el) { if (guardWrite()) deleteDoc(`items/${el.dataset.id}`); },
  'add-decision'() {
    if (!guardWrite()) return;
    const text = draft('decision.text').trim();
    if (!text) return;
    setDoc(`items/${newId('items')}`, { boardId: S.board, kind: 'decision', text: text.slice(0, 500), by: S.me, createdAt: nowIso() });
    clearDraft('decision.text');
  },
  'add-action'() {
    if (!guardWrite()) return;
    const text = draft('action.text').trim();
    if (!text) return;
    const due = draft('action.due');
    setDoc(`items/${newId('items')}`, { boardId: S.board, kind: 'action', text: text.slice(0, 300), ownerId: draft('action.owner', S.me), due: /^\d{4}-\d{2}-\d{2}$/.test(due) ? due : '', done: false, by: S.me, createdAt: nowIso() });
    clearDraft('action.text', 'action.due');
  },
  'notes-both'() {
    const merged = `${board()?.notes ?? ''}\n\n--- Toegevoegd door ${firstName(S.me)} ---\n${S.pendingNotes ?? ''}`;
    saveNotes(merged);
  },
  'notes-mine'() { saveNotes(S.pendingNotes ?? ''); },
  'notes-theirs'() { saveNotes(null); },
  'remove-comment'(el) {
    if (!guardWrite()) return;
    updateDoc(`ideas/${el.dataset.id}`, { comments: { [el.dataset.cid]: null } });
    toast('Reactie verwijderd.');
  },
  'remove-item'(el) { if (guardWrite()) deleteDoc(`items/${el.dataset.id}`); },
  async 'copy-md'() {
    const text = boardMarkdown(board());
    try { await navigator.clipboard.writeText(text); toast('Markdown gekopieerd.'); }
    catch { toast('Kopiëren lukte niet in deze weergave. Gebruik Download.', 'error'); }
  },
  async 'download-md'() {
    const b = board();
    const name = (b.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'sessie') + '.md';
    try { await S.cap.downloads.save({ filename: name, data: boardMarkdown(b) }); }
    catch (e) { if (e?.code !== 'dismissed' && e?.code !== 'cancelled') toast('Downloaden lukte niet.', 'error'); }
  },
  'modal-cancel'(el, e) {
    if (e.target.closest('[data-stop]') && el.classList.contains('modal-backdrop')) return;
    S.modal = null; render();
  },
  async 'modal-confirm'() { const m = S.modal; S.modal = null; render(); await m?.onConfirm?.(); },

  // Claude
  'ai-stop'() { aiCtl?.abort(); },
  'ai-ideas'() {
    const b = board();
    const focus = draft('ai.focus').trim().slice(0, 300);
    runAi('ideas', async (signal) => {
      const prompt = `${AI_INTRO}\n\n${boardContext(b)}\n\n---\nBedenk 8 nieuwe, onderling verschillende ideeën die de centrale vraag beantwoorden en nog níet op het bord staan. Verdeel ze over de vier rollen (lens: "ea" = Enterprise Architect, "pm" = Product Manager, "hr" = HR/Business Lead, "sa" = Solution Architect), zodat elke rol minstens één idee vanuit de eigen invalshoek krijgt. Je mag ook een idee toeschrijven aan een perspectief dat het team mist: "klant" (stem van de klant), "gtm" (commercie & go-to-market) of "risico" (risico & compliance). Mix veilige uitbreidingen van wat het team al kan met een paar gedurfde ideeën die echt buiten de ServiceNow-wereld liggen.${focus ? `\nExtra focus van het team: ${focus}` : ''}\n\nAntwoord uitsluitend met een JSON-array van objecten met de velden "text" (het idee in één krachtige zin, max ~20 woorden), "details" (twee à drie zinnen: waarom kansrijk, hoe te starten), "lens" (ea, pm, hr, sa, klant, gtm of risico) en "cluster" (exact één van: ${(b.clusters ?? []).map((c) => JSON.stringify(c.name)).join(', ')}).`;
      const ideas = await S.cap.sample.json(prompt, { signal, cache: false });
      if (!Array.isArray(ideas)) throw { code: 'invalid_json' };
      for (const idea of ideas.slice(0, 12)) {
        if (!idea || typeof idea.text !== 'string') continue;
        const cluster = (b.clusters ?? []).find((c) => c.name.toLowerCase() === String(idea.cluster ?? '').toLowerCase());
        await setDoc(`items/${newId('items')}`, { boardId: b.id, kind: 'suggestion', text: idea.text.slice(0, 280), details: String(idea.details ?? '').slice(0, 2000), lens: LENSES[idea.lens] ? idea.lens : null, clusterId: cluster?.id ?? b.clusters?.[0]?.id ?? null, by: S.me, createdAt: nowIso() });
      }
      toast('Nieuwe suggesties van Claude staan klaar.');
    });
  },
  'ai-challenge'(el) {
    const b = board();
    const idea = boardIdeas().find((i) => i.id === el.dataset.id);
    runAi('challenge', async (signal) => {
      const prompt = `${AI_INTRO}\n\n${boardContext(b)}\n\n---\nSpeel advocaat van de duivel voor dit idee: "${idea.text}"${idea.details ? ` (${idea.details})` : ''}. Bekijk het door de bril van elk van de vier rollen, benoem risico's en aannames, en stel een klein, concreet experiment voor dat binnen twee weken iets leert.\n\nAntwoord uitsluitend met één JSON-object: {"perspectives": {"ea": string, "pm": string, "hr": string, "sa": string}, "risks": [3 strings], "assumptions": [3 strings], "experiment": string}. Elke perspectief-tekst is 2-3 zinnen met een scherpe vraag.`;
      const r = await S.cap.sample.json(prompt, { signal, cache: false });
      if (!r || typeof r !== 'object' || !r.perspectives) throw { code: 'invalid_json' };
      const clean = {
        perspectives: Object.fromEntries(ROLE_KEYS.map((k) => [k, String(r.perspectives[k] ?? '').slice(0, 1200)])),
        risks: (Array.isArray(r.risks) ? r.risks : []).slice(0, 5).map((x) => String(x).slice(0, 400)),
        assumptions: (Array.isArray(r.assumptions) ? r.assumptions : []).slice(0, 5).map((x) => String(x).slice(0, 400)),
        experiment: String(r.experiment ?? '').slice(0, 1200), createdAt: nowIso(), by: S.me,
      };
      await updateDoc(`ideas/${idea.id}`, { aiChallenge: clean });
    }, idea.id);
  },
  'ai-extra'(el) {
    const b = board();
    const idea = boardIdeas().find((i) => i.id === el.dataset.id);
    const missing = EXTRA_KEYS.filter((k) => !idea.perspectives?.[k]);
    if (!missing.length) return toast('De extra perspectieven zijn al ingevuld.');
    runAi('extra', async (signal) => {
      const spec = missing.map((k) => `"${k}" = ${EXTRA[k].label} (${EXTRA[k].questions.join(' ')})`).join('\n');
      const prompt = `${AI_INTRO}\n\n${boardContext(b)}\n\n---\nBekijk dit idee: "${idea.text}"${idea.details ? ` (${idea.details})` : ''}.\nGeef voor elk van deze perspectieven, die niemand in het team vertegenwoordigt, een eerlijk oordeel van 2-3 zinnen:\n${spec}\n\nAntwoord uitsluitend met één JSON-object met als sleutels ${missing.map((k) => `"${k}"`).join(', ')}; elke waarde is {"text": string, "sentiment": "kans" | "neutraal" | "zorg"}.`;
      const r = await S.cap.sample.json(prompt, { signal, cache: false });
      if (!r || typeof r !== 'object') throw { code: 'invalid_json' };
      const fresh = boardIdeas().find((i) => i.id === idea.id);
      const patch = {};
      for (const k of missing) {
        const v = r[k];
        if (!v || typeof v.text !== 'string' || fresh?.perspectives?.[k]) continue;
        patch[k] = { text: v.text.slice(0, 2000), sentiment: ['kans', 'neutraal', 'zorg'].includes(v.sentiment) ? v.sentiment : 'neutraal', by: S.me, fromAi: true, updatedAt: nowIso() };
      }
      if (Object.keys(patch).length) await updateDoc(`ideas/${idea.id}`, { perspectives: patch });
    }, idea.id);
  },
  'ai-summary'() {
    const b = board();
    runAi('summary', async (signal) => {
      const prompt = `${AI_INTRO}\n\n${boardContext(b)}\n\n---\nMaak een samenvatting van deze sessie in Markdown met de kopjes:\n## Kern in drie zinnen\n## Sterkste ideeën (met waarom)\n## Waar de perspectieven botsen of blinde vlekken zitten\n## Open vragen\n## Voorgestelde volgende stappen (concreet, met suggestie welke rol trekt)`;
      const { text } = await S.cap.sample(prompt, { signal, cache: false, onText: ({ text }) => { S.aiStream = text; render(); } });
      await touchBoard({ aiSummary: { text: text.slice(0, 20_000), createdAt: nowIso(), by: S.me } });
    });
  },
  'ai-ask'() {
    const question = draft('ai.question').trim().slice(0, 2000);
    if (!question) return;
    clearDraft('ai.question');
    askClaude(question);
  },
  'ask-preset'(el) { askClaude(el.dataset.q); },
};

function askClaude(question) {
  const b = board();
  const history = boardItems('qa').slice(-6);
  runAi('ask', async (signal) => {
    S.pendingQuestion = question;
    const turns = [{ role: 'user', content: `${AI_INTRO}\n\n${boardContext(b)}\n\n---\nHet team stelt je vragen over deze sessie. Beantwoord ze in Markdown.` }];
    for (const t of history) { turns.push({ role: 'user', content: t.question }); turns.push({ role: 'assistant', content: t.answer }); }
    turns.push({ role: 'user', content: question });
    const { text } = await S.cap.sample(turns, { signal, cache: false, onText: ({ text }) => { S.aiStream = text; render(); } });
    await setDoc(`items/${newId('items')}`, { boardId: b.id, kind: 'qa', question, answer: text.slice(0, 20_000), by: S.me, createdAt: nowIso() });
  });
}

const changeHandlers = {
  'board-field'(el) { if (guardWrite()) { const v = el.value.trim(); if (el.dataset.field === 'title' && !v) return; touchBoard({ [el.dataset.field]: v.slice(0, el.dataset.field === 'description' ? 2000 : 500) }); } },
  'board-notes'(el) {
    if (!guardWrite()) return;
    const remote = board()?.notes ?? '';
    if (S.notesBase != null && remote !== S.notesBase && el.value !== remote) {
      S.pendingNotes = el.value;
      S.notesConflict = 'choose';
      render();
      return;
    }
    touchBoard({ notes: el.value.slice(0, 20_000), notesBy: S.me });
    S.notesBase = el.value;
    S.notesConflict = null;
  },
  'idea-field'(el) {
    if (!guardWrite()) return;
    let v = el.value;
    if (el.dataset.field === 'text') { v = v.trim().slice(0, 280); if (!v) return; }
    if (el.dataset.field === 'details') v = v.slice(0, 2000);
    if (el.dataset.field === 'lens') v = LENSES[v] ? v : null;
    updateDoc(`ideas/${el.dataset.id}`, { [el.dataset.field]: v });
  },
  perspective(el) {
    if (!guardWrite()) return;
    const k = el.dataset.key;
    if (ROLES[k] && k !== myRole()) return;
    const idea = boardIdeas().find((i) => i.id === el.dataset.id);
    const text = el.value.trim().slice(0, 2000);
    const sentiment = idea?.perspectives?.[k]?.sentiment ?? 'neutraal';
    updateDoc(`ideas/${el.dataset.id}`, { perspectives: { [k]: text ? { text, sentiment, by: S.me, fromAi: false, updatedAt: nowIso() } : null } });
  },
  'lens-filter'(el) { S.ui.lensFilter = el.value || null; render(); },
  'toggle-extra'(el) { S.ui.showExtra = el.checked; render(); },
  'toggle-parked'(el) { S.ui.showParked = el.checked; render(); },
  'toggle-action'(el) {
    if (!guardWrite()) return;
    const a = S.items.find((i) => i.id === el.dataset.id);
    updateDoc(`items/${el.dataset.id}`, { done: !a?.done });
  },
  'opp-stage'(el) { if (guardWrite()) updateDoc(`opportunities/${el.dataset.id}`, { stage: el.value }); },
  'action-owner'(el) { if (guardWrite()) updateDoc(`items/${el.dataset.id}`, { ownerId: el.value }); },
  'action-due'(el) { if (guardWrite()) updateDoc(`items/${el.dataset.id}`, { due: /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : '' }); },
  'opp-desc'(el) { if (guardWrite()) updateDoc(`opportunities/${el.dataset.id}`, { description: el.value.slice(0, 4000) }); },
  'opp-owner'(el) { if (guardWrite()) updateDoc(`opportunities/${el.dataset.id}`, { ownerId: el.value }); },
};

root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || !root.contains(el)) return;
  if (el.tagName === 'A' && el.getAttribute('href') !== '#') return;
  if (el.classList.contains('modal-backdrop') && e.target.closest('.modal')) return;
  actions[el.dataset.action]?.(el, e);
});
root.addEventListener('input', (e) => {
  const el = e.target;
  const k = el.dataset?.draft;
  if (k) S.drafts[k] = el.value;
  if (el.dataset?.counter) { const c = document.getElementById(el.dataset.counter); if (c) c.textContent = `${el.value.length}/${el.maxLength}`; }
  if (el.id === 'idea-search') { S.ui.query = el.value; render(); }
});
root.addEventListener('focusin', (e) => {
  if (e.target.id === 'board-notes') {
    S.notesBase = board()?.notes ?? '';
    S.cap.room?.presence({ board: S.board ?? null, editing: 'notes' }).catch(() => {});
  }
});
root.addEventListener('focusout', (e) => {
  if (e.target.id === 'board-notes') {
    S.cap.room?.presence({ board: S.board ?? null, editing: null }).catch(() => {});
    if (S.notesConflict === 'live') S.notesConflict = null;
  }
});
root.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.draft) { S.drafts[el.dataset.draft] = el.value; return; }
  if (el.dataset.change) changeHandlers[el.dataset.change]?.(el);
});
root.addEventListener('keydown', (e) => {
  const el = e.target;
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && el.dataset?.enter) {
    e.preventDefault();
    if (el.dataset.draft) S.drafts[el.dataset.draft] = el.value;
    actions[el.dataset.enter]?.(el, e);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (S.modal) { S.modal = null; render(); }
  else if (S.ui.openIdea) { document.activeElement?.blur(); S.ui.openIdea = null; render(); }
});

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
async function start() {
  document.documentElement.lang = 'nl';
  readHash();
  const use = (name) => (window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
  const [db, user, room, sample, downloads] = await Promise.all(['db', 'user', 'room', 'sample', 'downloads'].map(use));
  S.cap = { db, user, room, sample, downloads };
  S.started = true;
  if (user) {
    S.me = await user.id();
    S.canWrite = await user.can('data.write');
  }
  if (db) subscribe();
  if (room) {
    room.onPeers(({ peers }) => { S.peers = peers.filter((p) => p.kind === 'viewer'); scheduleProfiles(); queueMicrotask(render); }, () => {});
    room.presence({ board: S.board ?? null }).catch(() => {});
  }
  render();
  setInterval(() => { if (S.cap.db) render(); }, 60_000);
}
render();
start();
})();
</script>
